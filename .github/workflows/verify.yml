name: verify

# The repo's central claim is that a recording scores 100/100 on the page it was
# recorded from and 25/100 after a UI revision -- and that those numbers are
# asserted rather than derived, so a change in behaviour fails the check instead
# of quietly becoming a new baseline.
#
# That claim is worth nothing if it is only checked when someone remembers to
# run it. This runs it on every push.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # ffmpeg is a runtime requirement for video and the tool-surface tests
          # build a sample clip with it. Without it they skip rather than fail,
          # but a contract that is skipped on every push is never checked.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Published numbers reproduce
        # No model, no API key, no credentials. If this fails, either the code
        # changed behaviour or the published numbers were wrong, and both are
        # worth failing a build over.
        run: python reproduce.py --all --jobs 2

      - name: Tool-surface and verifier contracts
        run: python tests/test_tools.py

      - name: The recorder's frame bookkeeping holds
        # The recorder shoots a frame *before* each action and one after, and
        # registers both in the deck it hands to the paper. A frame that is shot
        # but never registered is invisible to everything downstream, and the
        # only symptom is a missing image -- which no other check would notice.
        run: python tests/test_recorder.py

      - name: The executor survives a click that navigates
        # Found on a third-party page: the executor clicked a form's submit
        # button and the next page view died with "Execution context was
        # destroyed". Every page this repo owned was a single-page app, so the
        # case its own click handling creates had never come up. The test builds
        # it locally -- a form that POSTs, slowly, then redirects.
        run: python tests/test_executor.py

      - name: Shipped artifacts are well-formed
        run: python tests/test_artifacts.py

      - name: Shipped verifiers discriminate
        # A verifier exists to refuse `done` on wrong work. Nothing had ever
        # checked that the assertions fail when the work is wrong, because every
        # run that used a working verifier passed it.
        run: python tests/test_verifiers.py

      - name: A fresh clone installs with one command
        # setup.sh is what the README tells a reader to run. Running it here
        # means the documented path cannot rot without the build going red.
        run: |
          bash setup.sh > /tmp/setup.log 2>&1 || { tail -40 /tmp/setup.log; exit 1; }
          tail -6 /tmp/setup.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module
        # Cheap and catches the class of mistake this repo has actually made:
        # a string that lost its escaping and became a syntax error.
        run: python -m compileall -q bench recorder induction verifier replay executor tests *.py
